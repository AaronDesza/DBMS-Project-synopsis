<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Places & World Tour Booking System</title>
    <meta name="description" content="Explore and book curated historical and heritage tours worldwide.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-banner { background: linear-gradient(rgba(15,23,42,0.78), rgba(15,23,42,0.78)), url('https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&w=1600&q=80') center/cover; color:#fff; padding:70px 0; }
        .place-card { transition: transform .25s ease, box-shadow .25s ease; border:none; border-radius:12px; overflow:hidden; }
        .place-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,.12); }
        .place-img { height:210px; object-fit:cover; }
        .badge-category { position:absolute; top:12px; right:12px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🏛️ WorldHeritage & Tour Booking</a>
        <div class="d-flex align-items-center gap-2">
            <span id="userGreeting" class="text-light me-2 small">Not logged in</span>
            <button class="btn btn-outline-warning btn-sm" onclick="openAdminModal()">Admin Panel</button>
            <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#authModal">Login / Register</button>
        </div>
    </div>
</nav>

<header class="hero-banner text-center">
    <div class="container">
        <h1 class="display-5 fw-bold mb-3">Explore Historical Places & Curated World Tours</h1>
        <div class="row justify-content-center g-2">
            <div class="col-md-5"><input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search monument or location..."></div>
            <div class="col-md-3">
                <select id="categoryFilter" class="form-select form-select-lg">
                    <option value="All">All Categories</option>
                    <option value="Historical">Historical</option>
                    <option value="Heritage">Heritage</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-warning btn-lg w-100 fw-bold" onclick="loadDestinations()">Explore</button></div>
        </div>
    </div>
</header>

<main class="container my-5"><div id="destinationsGrid" class="row g-4"></div></main>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Book Tour</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="selectedPackageId">
                <input type="hidden" id="selectedPackagePrice">
                <input type="hidden" id="selectedDurationDays">
                <div class="alert alert-info"><strong id="pkgSummaryName"></strong> — <span id="pkgSummaryDetails"></span></div>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label fw-semibold">Select Hotel</label><select id="hotelSelect" class="form-select" onchange="calculateTotal()"></select></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Select Transport</label><select id="transportSelect" class="form-select" onchange="calculateTotal()"></select></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Travel Date</label><input type="date" id="travelDate" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Payment Mode</label>
                        <select id="paymentMode" class="form-select">
                            <option value="UPI">UPI</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Net Banking">Net Banking</option>
                        </select>
                    </div>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded">
                    <span class="fw-bold fs-5">Total:</span>
                    <span class="fs-3 fw-bold text-success" id="liveTotalAmount">₹0.00</span>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-success btn-lg w-100" onclick="confirmBooking()">Confirm & Pay</button></div>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="reviewModalTitle">Reviews</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="reviewDestId">
                <div id="reviewsList" class="mb-3" style="max-height:200px;overflow-y:auto;"></div>
                <hr>
                <select id="reviewRating" class="form-select mb-2">
                    <option value="5">5 Stars ⭐⭐⭐⭐⭐</option>
                    <option value="4">4 Stars ⭐⭐⭐⭐</option>
                    <option value="3">3 Stars ⭐⭐⭐</option>
                    <option value="2">2 Stars ⭐⭐</option>
                    <option value="1">1 Star ⭐</option>
                </select>
                <textarea id="reviewComment" class="form-control mb-2" rows="3" placeholder="Share your experience..."></textarea>
                <button class="btn btn-primary w-100" onclick="submitReview()">Submit Review</button>
            </div>
        </div>
    </div>
</div>

<!-- Admin Modal -->
<div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">Admin Management</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 mb-3">
                    <div class="col-md-4"><input type="text" id="admName" class="form-control" placeholder="Destination Name"></div>
                    <div class="col-md-4"><input type="text" id="admLocation" class="form-control" placeholder="Location"></div>
                    <div class="col-md-4">
                        <select id="admCategory" class="form-select">
                            <option value="Historical">Historical</option>
                            <option value="Heritage">Heritage</option>
                        </select>
                    </div>
                    <div class="col-md-12"><input type="text" id="admImage" class="form-control" placeholder="Image URL"></div>
                    <div class="col-md-12"><input type="text" id="admDesc" class="form-control" placeholder="Description"></div>
                    <div class="col-md-6"><input type="text" id="admPkgName" class="form-control" placeholder="Package Name"></div>
                    <div class="col-md-3"><input type="number" id="admDays" class="form-control" placeholder="Days"></div>
                    <div class="col-md-3"><input type="number" id="admPrice" class="form-control" placeholder="Price (₹)"></div>
                </div>
                <button class="btn btn-dark w-100 mb-3" onclick="addDestinationPackage()">Add Destination & Package</button>
                <h6 class="fw-semibold">All Reviews</h6>
                <div id="adminReviewsList" style="max-height:200px;overflow-y:auto;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Auth Modal -->
<div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Authentication</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <select id="authRole" class="form-select mb-2">
                    <option value="traveller">Traveller</option>
                    <option value="admin">Administrator</option>
                </select>
                <input type="text" id="authName" class="form-control mb-2" placeholder="Full Name (Register only)">
                <input type="email" id="authEmail" class="form-control mb-2" placeholder="Email">
                <input type="password" id="authPass" class="form-control mb-2" placeholder="Password">
                <input type="text" id="authPhone" class="form-control mb-3" placeholder="Phone (Register only)">
                <div class="d-flex gap-2">
                    <button class="btn btn-primary w-50" onclick="handleAuth('login')">Login</button>
                    <button class="btn btn-outline-secondary w-50" onclick="handleAuth('register')">Register</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
